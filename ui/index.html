<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TorrentFast</title>
<style>
:root{
  --bg:#f3f3f3;--pane:#ebebeb;--card:#ffffff;--card2:#fafafa;--line:rgba(0,0,0,.08);--tx:#1b1b1b;--mut:#5f5f5f;
  --accent:#005fb8;--accentTx:#fff;--hover:rgba(0,0,0,.04);--press:rgba(0,0,0,.07);--shadow:0 2px 8px rgba(0,0,0,.08);
  --down:#0f6cbd;--done:#0f7b0f;--meta:#b47d00;--paused:#7a7a7a;--error:#c42b1c;--check:#8764b8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#202020;--pane:#1c1c1c;--card:#2b2b2b;--card2:#272727;--line:rgba(255,255,255,.08);--tx:#ffffff;--mut:#a8a8a8;
  --accent:#60cdff;--accentTx:#000;--hover:rgba(255,255,255,.05);--press:rgba(255,255,255,.08);--shadow:0 2px 8px rgba(0,0,0,.35);
  --down:#60cdff;--done:#6ccb5f;--meta:#fce100;--paused:#9d9d9d;--error:#ff99a4;--check:#c3a6ff;
}}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0}
body{font:14px/1.43 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;overflow:hidden}
.ico{font-family:"Segoe Fluent Icons","Segoe MDL2 Assets";font-style:normal;font-size:16px;line-height:1;display:inline-block;width:16px;text-align:center}
button{font:inherit;color:inherit}
/* ---------- navegación ---------- */
nav{width:240px;flex:none;background:var(--pane);padding:12px 6px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 12px 14px;font:600 15px "Segoe UI Variable Display","Segoe UI",sans-serif}
.brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#0f6cbd,#60cdff);display:grid;place-items:center;color:#fff;font-size:13px}
.nav{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;border:0;background:transparent;text-align:left;cursor:default;position:relative}
.nav:hover{background:var(--hover)}.nav:active{background:var(--press)}
.nav.on{background:var(--hover)}
.nav.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.nav .dot{width:10px;height:10px;border-radius:50%;flex:none}
.nav .n{margin-left:auto;color:var(--mut);font-size:12px}
.nav .lbl{flex:1}
.sep{height:1px;background:var(--line);margin:8px 10px}
nav .grow{flex:1}
/* ---------- principal ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0}
.cmd{display:flex;align-items:center;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line)}
.cmd h2{font:600 20px "Segoe UI Variable Display","Segoe UI",sans-serif;margin:0 16px 0 4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:5px;border:1px solid transparent;background:transparent;cursor:default}
.btn:hover{background:var(--hover)}.btn:active{background:var(--press)}
.btn.primary{background:var(--accent);color:var(--accentTx);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.std{background:var(--card);border-color:var(--line)}
.cmd .sp{flex:1}
#list{flex:1;overflow:auto;padding:12px 16px 16px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:6px}
.row:hover{background:var(--card2)}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text;-webkit-user-select:text}
.pill{font-size:12px;padding:1px 9px;border-radius:999px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap;justify-self:end}
.bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar div{height:100%;background:var(--c);border-radius:4px;transition:width .6s}
.meta{color:var(--mut);font-size:12px;display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meta b{color:var(--tx);font-weight:600}
.acts{display:flex;gap:2px;justify-self:end;opacity:.0;transition:opacity .15s}
.row:hover .acts,.acts:focus-within{opacity:1}
.ib{width:32px;height:28px;border-radius:5px;border:0;background:transparent;display:grid;place-items:center;cursor:default}
.ib:hover{background:var(--hover)}.ib.on{color:var(--accent)}.ib.danger:hover{color:var(--error)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mut)}
.empty .big{font-size:48px;margin-bottom:8px;opacity:.6}
.status{display:flex;gap:20px;align-items:center;padding:6px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.status b{color:var(--tx)}
.status .r{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- diálogos ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:9}
.scrim.on{display:grid}
.dlg{width:min(520px,92vw);background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.3);overflow:hidden}
.dlg .body{padding:22px 24px}
.dlg h3{margin:0 0 12px;font:600 20px "Segoe UI Variable Display","Segoe UI",sans-serif}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;background:var(--pane);border-top:1px solid var(--line)}
textarea,select,.num{width:100%;font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-bottom:2px solid var(--mut);border-radius:5px;padding:8px 10px;outline:0;user-select:text;-webkit-user-select:text}
textarea{height:110px;resize:none}
textarea:focus,select:focus{border-bottom-color:var(--accent)}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.set small{display:block;color:var(--mut)}
.set select{width:auto}.num{width:96px;text-align:right}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 16px;border-radius:7px;display:none;gap:10px;align-items:center;z-index:10}
.toast.on{display:flex}
.drop{position:fixed;inset:10px;border:2px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,transparent);display:none;place-items:center;font-size:18px;z-index:8;pointer-events:none}
.drop.on{display:grid}
body.focus .row[data-k=done],body.focus .row[data-k=paused]{display:none}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:content-box}
</style>
</head>
<body>
<nav>
  <div class="brand"><span class="logo">⚡</span>TorrentFast</div>
  <div id="navs"></div>
  <div class="sep"></div>
  <button class="nav" id="focusBtn"><i class="ico">&#xE7B3;</i><span class="lbl" data-t="focus"></span></button>
  <div class="grow"></div>
  <button class="nav" id="setBtn"><i class="ico">&#xE713;</i><span class="lbl" data-t="settings"></span></button>
</nav>
<main>
  <div class="cmd">
    <h2 id="title"></h2>
    <button class="btn primary" id="addBtn"><i class="ico">&#xE710;</i><span data-t="addMagnet"></span></button>
    <button class="btn" id="fileBtn"><i class="ico">&#xE8E5;</i><span data-t="openTorrent"></span></button>
    <input type="file" id="file" accept=".torrent" multiple hidden>
    <span class="sp"></span>
    <button class="btn" id="pauseAll"><i class="ico">&#xE769;</i><span data-t="pauseAll"></span></button>
    <button class="btn" id="resumeAll"><i class="ico">&#xE768;</i><span data-t="resumeAll"></span></button>
    <button class="btn" id="folderBtn"><i class="ico">&#xE838;</i><span data-t="folder"></span></button>
  </div>
  <div id="list"></div>
  <div class="status">
    <span>↓ <b id="sd">0</b></span><span>↑ <b id="su">0</b></span><span id="sp"></span><span class="r" id="sf"></span>
  </div>
</main>

<div class="scrim" id="addDlg"><div class="dlg">
  <div class="body"><h3 data-t="addMagnet"></h3>
    <textarea id="mag" data-tp="magnetPh"></textarea></div>
  <div class="foot"><button class="btn primary" id="addOk" data-t="download"></button><button class="btn std" data-close data-t="cancel"></button></div>
</div></div>

<div class="scrim" id="setDlg"><div class="dlg">
  <div class="body"><h3 data-t="settings"></h3>
    <div class="set"><div><span data-t="language"></span></div>
      <select id="lang"><option value="auto" data-t="auto"></option><option value="es">Español</option><option value="en">English</option></select></div>
    <div class="set"><div><span data-t="lineSpeed"></span><small data-t="lineSub"></small></div>
      <span><input type="number" id="lineMbps" min="1" max="100000" step="1" class="num"> Mbps</span></div>
    <div class="set"><div><span data-t="upMax"></span><small id="upCalc"></small></div>
      <select id="upPct"><option value="5">5%</option><option value="10">10%</option><option value="20">20%</option><option value="50">50%</option><option value="100" data-t="noLimit"></option></select></div>
    <div class="set"><div><span data-t="saveIn"></span><small id="savePath"></small></div>
      <button class="btn std" id="chooseDir" data-t="change"></button></div>
    <div class="set" id="assocRow"><div><span data-t="assoc"></span><small data-t="assocSub"></small></div>
      <button class="btn std" id="assocBtn" data-t="enable"></button></div>
    <div class="set"><div><span data-t="phone"></span><small id="lanUrl"></small></div>
      <button class="btn std" id="lanBtn"></button></div>
  </div>
  <div class="foot"><button class="btn primary" data-close data-t="close"></button></div>
</div></div>

<div class="drop" id="drop"><span data-t="dropHere"></span></div>
<div class="toast" id="toast"></div>

<script>
const I18N={
 es:{all:"Todos",down:"Descargando",meta:"Buscando datos",done:"Completados",paused:"Pausados",error:"Con error",check:"Verificando",
  focus:"Modo enfoque",settings:"Configuración",addMagnet:"Agregar magnet",openTorrent:"Abrir .torrent",pauseAll:"Pausar todo",resumeAll:"Reanudar todo",
  folder:"Abrir carpeta",download:"Descargar",cancel:"Cancelar",close:"Cerrar",magnetPh:"Pega uno o varios enlaces magnet:?xt=… (uno por línea)",
  language:"Idioma",lineSpeed:"Velocidad de tu internet",lineSub:"La bajada nunca se limita",upMax:"Subida máxima",noLimit:"Sin límite",upTo:"hasta",limit:"límite",auto:"Automático",saveIn:"Guardar descargas en",change:"Cambiar…",assoc:"Abrir magnets y .torrent con TorrentFast",
  assocSub:"Al dar clic en un magnet en cualquier página se agrega aquí",enable:"Activar",enabled:"Activado ✓",phone:"Desde el celular",
  dropHere:"Suelta tus archivos .torrent aquí",emptyT:"Nada por aquí todavía",emptyS:"Pega un magnet con Ctrl+V o arrastra un .torrent a esta ventana",
  pause:"Pausar",resume:"Reanudar",seq:"Descarga secuencial (para ver video mientras baja)",remove:"Quitar de la lista",del:"Borrar archivos",
  openItem:"Abrir carpeta",of:"de",peers:"peers",eta:"Restante",added:"Agregado ✓",confirmDel:"Vuelve a presionar para borrar los archivos",
  offline:"Sin conexión con el motor…",lanOff:"Desactivado",lanRestart:"Reinicia TorrentFast para aplicar el cambio",disable:"Desactivar",paused_:"pausado",
  st:["en cola","verificando","buscando datos","descargando","terminado","compartiendo","preparando","verificando"]},
 en:{all:"All",down:"Downloading",meta:"Fetching metadata",done:"Completed",paused:"Paused",error:"Errors",check:"Checking",
  focus:"Focus mode",settings:"Settings",addMagnet:"Add magnet",openTorrent:"Open .torrent",pauseAll:"Pause all",resumeAll:"Resume all",
  folder:"Open folder",download:"Download",cancel:"Cancel",close:"Close",magnetPh:"Paste one or more magnet:?xt=… links (one per line)",
  language:"Language",lineSpeed:"Your internet speed",lineSub:"Download is never limited",upMax:"Max upload",noLimit:"Unlimited",upTo:"up to",limit:"limit",auto:"Automatic",saveIn:"Save downloads to",change:"Change…",assoc:"Open magnets and .torrent files with TorrentFast",
  assocSub:"Clicking a magnet link on any page adds it here",enable:"Enable",enabled:"Enabled ✓",phone:"From your phone",
  dropHere:"Drop your .torrent files here",emptyT:"Nothing here yet",emptyS:"Paste a magnet with Ctrl+V or drag a .torrent into this window",
  pause:"Pause",resume:"Resume",seq:"Sequential download (watch video while downloading)",remove:"Remove from list",del:"Delete files",
  openItem:"Open folder",of:"of",peers:"peers",eta:"Remaining",added:"Added ✓",confirmDel:"Press again to delete the files",
  offline:"Engine not responding…",lanOff:"Off",lanRestart:"Restart TorrentFast to apply",disable:"Disable",paused_:"paused",
  st:["queued","checking","fetching metadata","downloading","finished","seeding","allocating","checking"]}};
const COL={down:"var(--down)",done:"var(--done)",meta:"var(--meta)",paused:"var(--paused)",error:"var(--error)",check:"var(--check)"};
const $=id=>document.getElementById(id);
let L=I18N.es,filt="all",focus=false,cfg={},last={items:[]};
const native=()=>window.pywebview&&window.pywebview.api;

function setLang(code){
  if(code==="auto"||!code)code=(navigator.language||"es").toLowerCase().startsWith("es")?"es":"en";
  L=I18N[code];document.documentElement.lang=code;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=L[e.dataset.t]);
  document.querySelectorAll("[data-tp]").forEach(e=>e.placeholder=L[e.dataset.tp]);
  render();
}
const h=n=>{const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]};
const mb=n=>(n*8/1e6).toFixed(n*8/1e6>=100?0:1)+" Mb/s";
const eta=s=>s<0?"—":s>=86400?Math.floor(s/86400)+"d "+Math.floor(s%86400/3600)+"h":Math.floor(s/3600)+"h "+String(Math.floor(s%3600/60)).padStart(2,"0")+"m";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;function toast(t,err){const e=$("toast");e.textContent=t;e.style.color=err?"var(--error)":"";e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3200)}
async function api(p,body){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}

async function addMagnets(text){const links=text.split(/\s+/).filter(s=>s.startsWith("magnet:"));if(!links.length)return false;
  let ok=0;for(const m of links){try{await api("/api/add",{src:m});ok++}catch(e){toast(e.message,1)}}
  if(ok)toast(L.added+(ok>1?" ("+ok+")":""));tick();return true}
async function uploadFiles(files){for(const f of files){if(!f.name.toLowerCase().endsWith(".torrent"))continue;
  try{const r=await fetch("/api/upload?name="+encodeURIComponent(f.name),{method:"POST",body:f});if(!r.ok)throw new Error((await r.json()).error);toast(L.added)}catch(e){toast(e.message,1)}}tick()}

const armed={};
async function act(ih,a){
  if(a==="delete"){if(!armed[ih]){armed[ih]=1;toast(L.confirmDel);setTimeout(()=>delete armed[ih],4000);return}delete armed[ih]}
  try{await api("/api/action",{ih,act:a});tick()}catch(e){toast(e.message,1)}}

function navs(items){const c={all:items.length};items.forEach(t=>c[t.kind]=(c[t.kind]||0)+1);
  const keys=["all","down","meta","done","paused","error"];
  $("navs").innerHTML=keys.filter(k=>k==="all"||k==="down"||k==="done"||c[k]).map(k=>
   `<button class="nav ${filt===k?"on":""}" data-f="${k}">${k==="all"?'<i class="ico">&#xE8FD;</i>':`<span class="dot" style="background:${COL[k]}"></span>`}<span class="lbl">${L[k]}</span><span class="n">${c[k]||0}</span></button>`).join("");
  $("title").textContent=L[filt];}

function render(){const d=last;navs(d.items);
  const it=d.items.filter(t=>filt==="all"||t.kind===filt);
  $("list").innerHTML=it.length?it.map(t=>{const st=t.paused?L.paused_:(L.st[t.state]||"");
   return `<div class="row" data-k="${t.kind}" style="--c:${COL[t.kind]}">
   <div class="name" title="${esc(t.name)}">${esc(t.name)}</div><span class="pill">${st}</span>
   <div class="bar"><div style="width:${(t.progress*100).toFixed(1)}%"></div></div>
   <div class="meta"><span><b>${(t.progress*100).toFixed(1)}%</b> ${L.of} ${h(t.size)}</span><span>↓ <b>${h(t.down)}/s</b></span><span>↑ ${h(t.up)}/s</span>
    <span><b>${t.peers}</b> ${L.peers} (${t.seeds} seeds)</span><span>${L.eta} <b>${eta(t.eta)}</b></span>${t.error?`<span style="color:var(--error)">${esc(t.error)}</span>`:""}</div>
   <div class="acts">
    ${t.paused?`<button class="ib" title="${L.resume}" onclick="act('${t.ih}','resume')"><i class="ico">&#xE768;</i></button>`:`<button class="ib" title="${L.pause}" onclick="act('${t.ih}','pause')"><i class="ico">&#xE769;</i></button>`}
    <button class="ib ${t.seq?"on":""}" title="${L.seq}" onclick="act('${t.ih}','seq')"><i class="ico">&#xE8CB;</i></button>
    <button class="ib" title="${L.openItem}" onclick="act('${t.ih}','open')"><i class="ico">&#xE838;</i></button>
    <button class="ib" title="${L.remove}" onclick="act('${t.ih}','remove')"><i class="ico">&#xE711;</i></button>
    <button class="ib danger" title="${L.del}" onclick="act('${t.ih}','delete')"><i class="ico">&#xE74D;</i></button>
   </div></div>`}).join("")
   :`<div class="empty"><div><div class="big ico" style="width:auto">&#xE896;</div><div style="font-size:16px;color:var(--tx)">${L.emptyT}</div><div>${L.emptyS}</div></div></div>`;
  $("sd").textContent=h(d.down||0)+"/s · "+mb(d.down||0)+(d.line_mbps?" / "+d.line_mbps+" Mb/s":"");
  $("su").textContent=h(d.up||0)+"/s"+(d.up_cap?" ("+L.limit+" "+mb(d.up_cap)+")":"");
  $("sp").textContent=d.items.reduce((a,t)=>a+t.peers,0)+" "+L.peers;$("sf").textContent=d.out||"";
  document.title=d.down>0?`↓ ${h(d.down)}/s · TorrentFast`:"TorrentFast";}

async function tick(){try{last=await (await fetch("/api/status")).json();render()}catch(e){$("sf").textContent=L.offline}}

// ---------- eventos ----------
$("navs").onclick=e=>{const b=e.target.closest("[data-f]");if(b){filt=b.dataset.f;render()}};
$("focusBtn").onclick=()=>{focus=!focus;document.body.classList.toggle("focus",focus);$("focusBtn").classList.toggle("on",focus)};
$("addBtn").onclick=()=>{$("addDlg").classList.add("on");$("mag").value="";setTimeout(()=>$("mag").focus(),50)};
$("addOk").onclick=async()=>{if(await addMagnets($("mag").value))$("addDlg").classList.remove("on");else toast(L.magnetPh,1)};
$("fileBtn").onclick=()=>$("file").click();
$("file").onchange=()=>{uploadFiles($("file").files);$("file").value=""};
$("pauseAll").onclick=()=>api("/api/bulk",{act:"pause"}).then(tick);
$("resumeAll").onclick=()=>api("/api/bulk",{act:"resume"}).then(tick);
$("folderBtn").onclick=()=>api("/api/open_folder");
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".scrim").classList.remove("on"));
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")document.querySelectorAll(".scrim.on").forEach(s=>s.classList.remove("on"));
  if(e.key==="Enter"&&e.ctrlKey&&$("addDlg").classList.contains("on"))$("addOk").click();});
document.addEventListener("paste",e=>{if(e.target.tagName==="TEXTAREA")return;const t=(e.clipboardData||window.clipboardData).getData("text");if(t)addMagnets(t)});
let dz=0;
document.addEventListener("dragenter",e=>{e.preventDefault();dz++;$("drop").classList.add("on")});
document.addEventListener("dragleave",e=>{dz--;if(dz<=0){dz=0;$("drop").classList.remove("on")}});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();dz=0;$("drop").classList.remove("on");
  if(e.dataTransfer.files.length)uploadFiles(e.dataTransfer.files);else addMagnets(e.dataTransfer.getData("text"))});

// ---------- configuración ----------
async function loadCfg(){cfg=await (await fetch("/api/settings")).json();setLang(cfg.lang);$("lang").value=cfg.lang||"auto";
  $("savePath").textContent=cfg.save;$("lineMbps").value=cfg.line_mbps;$("upPct").value=String(Math.round(cfg.up_pct));
  const cap=cfg.up_pct>=100?0:cfg.line_mbps*1e6/8*cfg.up_pct/100;
  $("upCalc").textContent=cap?`${L.upTo} ${mb(cap)} (${h(cap)}/s)`:L.noLimit;$("lanUrl").textContent=cfg.lan_url||L.lanOff;
  $("lanBtn").textContent=cfg.lan?L.disable:L.enable;
  if(!!cfg.lan!==!!cfg.lan_active)$("lanUrl").textContent=L.lanRestart;
  $("assocRow").style.display=cfg.can_associate?"":"none";$("assocBtn").textContent=cfg.associated?L.enabled:L.enable;}
$("setBtn").onclick=()=>{loadCfg();$("setDlg").classList.add("on")};
$("lineMbps").onchange=async()=>{try{await api("/api/settings",{line_mbps:+$("lineMbps").value});loadCfg()}catch(e){toast(e.message,1)}};
$("upPct").onchange=async()=>{await api("/api/settings",{up_pct:+$("upPct").value});loadCfg()};
$("lang").onchange=async()=>{await api("/api/settings",{lang:$("lang").value});loadCfg()};
$("lanBtn").onclick=async()=>{await api("/api/settings",{lan:!cfg.lan});loadCfg()};
$("assocBtn").onclick=async()=>{try{await api("/api/associate");loadCfg();toast(L.enabled)}catch(e){toast(e.message,1)}};
$("chooseDir").onclick=async()=>{let p=null;
  if(native())p=await window.pywebview.api.choose_folder();
  else p=prompt(L.saveIn,cfg.save);
  if(p){await api("/api/settings",{save:p});loadCfg()}};

loadCfg().then(tick);setInterval(tick,1000);
</script>
</body>
</html>
