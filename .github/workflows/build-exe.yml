name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build TorrentFast.exe (desktop app)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name TorrentFast
          --icon assets/icon.ico --version-file version_info.txt
          --add-data "ui;ui" --collect-all libtorrent --collect-all webview
          --hidden-import clr torrentfast_app.py

      - name: Build TorrentFast-CLI.exe (command line)
        run: >
          pyinstaller --noconfirm --onefile --console --name TorrentFast-CLI
          --icon assets/icon.ico --collect-all libtorrent torrentfast.py

      - name: Self-test (engine + UI bundled)
        shell: pwsh
        run: |
          $p = Start-Process dist\TorrentFast.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed ($($p.ExitCode))" }
          Write-Host "Self-test OK"

      - name: Launch test (real window, single instance, magnet hand-off)
        timeout-minutes: 4
        shell: pwsh
        run: |
          $p = Start-Process dist\TorrentFast.exe -PassThru
          $file = "$env:APPDATA\TorrentFast\instance.json"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $file); $i++) { Start-Sleep 1 }
          Start-Sleep 5
          if ($p.HasExited) { throw "App closed on startup (exit $($p.ExitCode))" }
          $port = (Get-Content $file | ConvertFrom-Json).port
          $q = Start-Process dist\TorrentFast.exe -ArgumentList '"magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel"' -PassThru
          if (-not $q.WaitForExit(30000)) { Stop-Process $q.Id -Force; Stop-Process $p.Id -Force; throw "Second instance did not hand off the magnet" }
          $s = Invoke-RestMethod "http://127.0.0.1:$port/api/status"
          Stop-Process $p.Id -Force
          if ($s.items.Count -ne 1) { throw "Magnet was not added to the running window" }
          if ($s.up_cap -ne 3750000) { throw "Upload cap is $($s.up_cap), expected 3750000 (10% of 300 Mbps)" }
          Write-Host "Window OK on port $port, magnet handed off, upload cap $($s.up_cap) B/s"

      - name: Show app log
        if: always()
        shell: pwsh
        run: Get-Content "$env:APPDATA\TorrentFast\app.log" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: TorrentFast-windows
          path: dist/*.exe

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*.exe
