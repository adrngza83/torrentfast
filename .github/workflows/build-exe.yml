name: Compilar TorrentFast.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Probar que libtorrent carga
        run: python -c "import libtorrent as lt; print(lt.__version__)"
      - name: Compilar .exe
        run: |
          pyinstaller --onefile --name TorrentFast --collect-all libtorrent --hidden-import torrentfast torrentfast_web.py
          pyinstaller --onefile --name TorrentFast-CLI --collect-all libtorrent torrentfast.py
      - name: Probar el .exe
        shell: pwsh
        run: |
          $p = Start-Process dist\TorrentFast.exe -ArgumentList "--no-browser","-o","$env:RUNNER_TEMP\tf" -PassThru
          Start-Sleep 8
          $r = Invoke-RestMethod http://localhost:8800/api/status
          Write-Host "OK: puerto P2P $($r.port)"
          Stop-Process $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: TorrentFast-windows
          path: dist/*.exe
      - name: Publicar versión
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: TorrentFast ${{ github.event.release.tag_name || github.ref_name }}
          body: |
            Descarga **TorrentFast.exe**, dale doble clic y se abre en tu navegador (http://localhost:8800).
            `TorrentFast-CLI.exe` es la versión de terminal.
          files: dist/*.exe
